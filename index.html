<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LWG Team Tool</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>LWG Team Tool</h1>
    <span id="patchBadge" class="patch-badge">loading…</span>
  </header>

  <div id="loadingScreen" class="loading-screen">
    <div class="spinner"></div>
    <p>Loading champion data from Riot Data Dragon…</p>
  </div>

  <main id="app" class="app hidden">
    <aside class="sidebar">
      <h2>Players</h2>
      <form id="addPersonForm" class="add-person-form">
        <input id="newPersonName" type="text" placeholder="Name…" autocomplete="off" required />
        <input id="newPersonOpgg" type="text" placeholder="na.op.gg link (optional)" autocomplete="off" />
        <input id="newPersonRiotId" type="text" placeholder="Riot ID e.g. Name#Tag (optional)" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <ul id="peopleList" class="people-list"></ul>
    </aside>

    <section class="main-panel">
      <nav class="tabs">
        <button class="tab-btn active" data-tab="pool">Pool</button>
        <button class="tab-btn" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="calendar">Calendar</button>
        <button class="tab-btn" data-tab="comps">Comps</button>
        <button class="tab-btn" data-tab="matches">Matches</button>
      </nav>

      <div id="poolTab" class="tab-panel active">
        <div id="noPersonSelected" class="empty-state">
          <p>Select or add a player to manage their champion pool.</p>
        </div>

        <div id="personPool" class="person-pool hidden">
          <div class="person-pool-header">
            <h2 id="selectedPersonName"></h2>
            <div id="opggBox" class="opgg-box"></div>
          </div>

          <h3>Their Pool</h3>
          <div id="poolGrid" class="champion-grid pool-grid"></div>

          <h3>Add Champions</h3>
          <input id="championSearch" type="text" placeholder="Search champions…" autocomplete="off" />
          <div class="filter-row">
            <span class="filter-label">Lane</span>
            <div id="laneFilterChips" class="filter-chips"></div>
          </div>
          <div class="filter-row">
            <span class="filter-label">Class</span>
            <div id="classFilterChips" class="filter-chips"></div>
          </div>
          <div id="allChampionsGrid" class="champion-grid all-grid"></div>
        </div>
      </div>

      <div id="overviewTab" class="tab-panel">
        <h2>Role Coverage</h2>
        <div id="coverageWarnings" class="coverage-warnings"></div>
        <div id="coverageTable" class="coverage-table"></div>
      </div>

      <div id="calendarTab" class="tab-panel">
        <form id="addEventForm" class="add-event-form">
          <input id="newEventTitle" type="text" placeholder="Event title…" autocomplete="off" required />
          <input id="newEventDate" type="date" required />
          <input id="newEventTime" type="time" />
          <select id="newEventTimezone"></select>
          <input id="newEventNotes" type="text" placeholder="Notes (optional)" autocomplete="off" />
          <button type="submit">Add Event</button>
        </form>

        <div class="calendar-header">
          <button id="prevMonthBtn" type="button" aria-label="Previous month">‹</button>
          <h2 id="calendarMonthLabel"></h2>
          <button id="nextMonthBtn" type="button" aria-label="Next month">›</button>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

        <div id="dayDetailPanel" class="day-detail-panel hidden">
          <h3 id="dayDetailTitle"></h3>
          <div id="dayDetailEvents"></div>
        </div>
      </div>

      <div id="compsTab" class="tab-panel">
        <form id="addCompForm" class="add-comp-form">
          <input id="newCompName" type="text" placeholder="Team comp name…" autocomplete="off" required />
          <button type="submit">Add Comp</button>
        </form>

        <div id="compsList" class="comps-list"></div>
      </div>

      <div id="matchesTab" class="tab-panel">
        <div id="noPersonSelectedMatches" class="empty-state">
          <p>Select or add a player to view their match data.</p>
        </div>

        <div id="matchesContent" class="matches-content hidden">
          <div class="person-pool-header">
            <h2 id="matchesPersonName"></h2>
            <div id="riotIdBox" class="opgg-box"></div>
          </div>

          <button id="loadMatchesBtn" type="button" class="load-matches-btn">Load match data</button>
          <div id="matchesStatus" class="matches-status"></div>

          <div id="rankedSection" class="matches-section"></div>
          <div id="liveSection" class="matches-section"></div>
          <div id="historySection" class="matches-section"></div>
        </div>
      </div>
    </section>
  </main>

  <template id="championIconTemplate">
    <div class="champ-icon" tabindex="0">
      <img loading="lazy" />
      <span class="champ-name"></span>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
